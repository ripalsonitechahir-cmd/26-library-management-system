# web (React + Nginx) -> api (Express + Prisma) -> SQLite file on the named volume "library-data"
services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: file:/data/library.db
      LOAN_DAYS: ${LOAN_DAYS:-14}
      FINE_PER_DAY: ${FINE_PER_DAY:-1}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - library-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_HOST: api
      API_PORT: 3000
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  library-data:
