# API: one replica only - SQLite allows a single writer pod on a ReadWriteOnce volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: library-management-system
  labels: { app: api }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: api
          image: library-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: library-config }
            - secretRef: { name: library-secret }
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: library-data }
